<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {         
        text-align: center;
        font-size: larger;
        box-sizing: border-box;
       }
       header {
        /* margin: 10px; */
        width: 100%;
        height: 70px;
        padding: 30px;
        background-color: rgb(175, 135, 212);
        border-style: inset;
        }
        nav {
            width: 100%;
            height: 70px;
            padding: 30px;
            background-color: rgb(20, 190, 212);
            border-style: inset;
        }
        aside {
            float: right;
            width: 40%;
            height: 300px;
            padding: 30px;
            background-color: rgb(200, 29, 13);
            border-style: inset;
            }
        section {
            width: 120%;
            height: 150px;
            padding: 30px;
            background-color: rgb(232, 188, 224);
            border-style: inset;
            }
        article {
            width: 115%;
            height: 150px;
            padding: 30px;
            background-color: rgb(111, 160, 166);
            border-style: inset;
            }
        footer {
            width: 100%;
            height: 100px;
            padding: 30px;
            background-color: rgb(177, 106, 210);
            border-style: inset;
        }
    </style>
</head>
<body>
    <header>HEADER</header>
    <nav>NAVBAR</nav>
    <aside>ASIDE</aside>
    <section>SECTION</section>
    <article>ARTICLE</article>
    <footer>FOOTER</footer> 
</body>
</html>
