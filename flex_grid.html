<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flexgrid</title>
    <style>
        .box{
            width: 200px;
            height: 200px;
            background-color: #8eda;
            font-size: medium;
        }
        body{
            display: flex;
            justify-content: flex-start;
            align-items: center;
            min-height: 800px;
            border: 5px solid black;
            flex-direction: row-reverse;
        }
    </style>
</head>
<body>
    <div class="box">
        Box 1
    </div>
    <div class="box">
        Box 2
    </div>
    <div class="box">
        Box 3
    </div>
    <div class="box">
        Box 4
    </div>
    <div class="box">
        Box 5
    </div>
</body>
</html>
